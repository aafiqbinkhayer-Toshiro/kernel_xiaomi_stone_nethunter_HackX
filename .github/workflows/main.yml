name: Build Stone NetHunter Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name (arch/arm64/configs/ এর ভিতরে, e.g. stone_defconfig বা vendor/xxx_defconfig)"
        required: true
        default: "moonstone_defconfig"
      toolchain:
        description: "Clang toolchain"
        type: choice
        default: neutron
        options:
          - neutron
          - aosp
      extra_configs:
        description: "Extra configs (space separated), e.g. CONFIG_FOO=y CONFIG_BAR=n CONFIG_BAZ=m"
        required: false
        default: ""
      donor_repo:
        description: "(Optional) নিজের donor repo URL (এটা আগে চেষ্টা হবে, তারপর built-in donor লিস্ট)"
        required: false
        default: ""
      donor_branch:
        description: "(Optional) donor repo-র branch"
        required: false
        default: ""
      skip_missing:
        description: "Missing .i ফাইলের driver disable করে build চালাবে (ওই hardware কাজ করবে না!)"
        type: boolean
        default: false
      release:
        description: "GitHub Release বানাবে?"
        type: boolean
        default: false

permissions:
  contents: write

env:
  DEFCONFIG: ${{ inputs.defconfig || 'moonstone_defconfig' }}
  TOOLCHAIN: ${{ inputs.toolchain || 'neutron' }}
  EXTRA_CONFIGS: ${{ inputs.extra_configs || '' }}
  DONOR_REPO: ${{ inputs.donor_repo || '' }}
  DONOR_BRANCH: ${{ inputs.donor_branch || '' }}
  SKIP_MISSING: ${{ inputs.skip_missing || 'false' }}
  # format: repo_url|branch  (branch ফাঁকা = default branch). এক এক লাইনে এক donor, উপর থেকে নিচে চেষ্টা হবে
  DEFAULT_DONORS: |
    https://github.com/MiCode/Xiaomi_Kernel_OpenSource|stone-t-oss
    https://github.com/MiCode/Xiaomi_Kernel_OpenSource|stone-s-oss
    https://github.com/Fucking-Projekt/android_kernel_xiaomi_stone|
    https://github.com/mayuresh2543/kernel_xiaomi_stone_rebase|
    https://github.com/Jyjyc/eclipse_kernel_xiaomi_stone|
    https://github.com/gawasvedraj/kernel_xiaomi_stone|
  AOSP_CLANG: clang-r522817
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev cpio lz4 zip unzip xz-utils \
            python3 curl git ccache dwarves device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-stone-${{ env.TOOLCHAIN }}-${{ github.sha }}
          restore-keys: |
            ccache-stone-${{ env.TOOLCHAIN }}-

      - name: Setup Neutron Clang
        if: ${{ env.TOOLCHAIN == 'neutron' }}
        run: |
          mkdir -p "$HOME/toolchain" && cd "$HOME/toolchain"
          curl -fsSLo antman https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman
          ./antman -S
          echo "$HOME/toolchain/bin" >> "$GITHUB_PATH"

      - name: Setup AOSP Clang
        if: ${{ env.TOOLCHAIN == 'aosp' }}
        run: |
          mkdir -p "$HOME/toolchain" && cd "$HOME/toolchain"
          curl -fsSL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${AOSP_CLANG}.tar.gz" | tar xz
          echo "$HOME/toolchain/bin" >> "$GITHUB_PATH"

      - name: Verify defconfig
        run: |
          clang --version | head -n1
          if [ ! -f "arch/arm64/configs/${DEFCONFIG}" ]; then
            echo "::error::arch/arm64/configs/${DEFCONFIG} পাওয়া যায়নি। নিচের লিস্ট থেকে সঠিকটা দাও:"
            find arch/arm64/configs -iname '*stone*' -o -iname '*holi*' -o -iname '*sm4375*' -o -iname '*sm6375*' | sort
            exit 1
          fi

      - name: Check missing .i include files (gitignored)
        run: |
          # kernel .gitignore-এ *.i থাকায় #include "xxx.i" ফাইলগুলো প্রায়ই push হয় না
          scan_missing() {
            : > missing_i.txt
            grep -rIl --include='*.c' --include='*.h' -E '#include "[^"]+\.i"' drivers sound techpack net 2>/dev/null | while read -r f; do
              d="$(dirname "$f")"
              grep -ohE '#include "[^"]+\.i"' "$f" | sed -E 's/#include "(.*)"/\1/' | while read -r inc; do
                target="$(realpath -m --relative-to=. "$d/$inc")"
                [ -f "$target" ] || echo "$target" >> missing_i.txt
              done
            done
            sort -u missing_i.txt -o missing_i.txt
          }

          scan_missing
          if [ ! -s missing_i.txt ]; then
            echo "No missing .i include files."
            exit 0
          fi

          echo "::warning::Missing .i files in repo:"
          cat missing_i.txt

          # 1) donor repo থেকে কপি (user-এর donor_repo আগে, তারপর DEFAULT_DONORS লিস্ট)
          DONORS=""
          if [ -n "${DONOR_REPO}" ]; then
            DONORS="${DONOR_REPO}|${DONOR_BRANCH}"$'\n'
          fi
          DONORS="${DONORS}${DEFAULT_DONORS}"

          while IFS='|' read -r url branch; do
            [ -z "$url" ] && continue
            echo "=== Donor: $url ${branch:+(branch: $branch)} ==="
            rm -rf donor
            # blob ছাড়া clone: শুধু file list আনে, দরকারি ফাইল পরে আলাদা আনে (দ্রুত)
            if ! git clone --quiet --depth=1 --filter=blob:none --no-checkout ${branch:+-b "$branch"} "$url" donor 2>/dev/null; then
              echo "clone হয়নি (repo/branch নেই?), পরের donor দেখছি"
              continue
            fi
            git -C donor ls-tree -r --name-only HEAD > donor_files.txt
            while read -r target; do
              [ -f "$target" ] && continue
              if grep -Fxq "$target" donor_files.txt; then
                src="$target"
              else
                src="$(grep -F "/$(basename "$target")" donor_files.txt | grep -E "/$(basename "$target")$" | head -n1 || true)"
              fi
              if [ -n "$src" ]; then
                mkdir -p "$(dirname "$target")"
                git -C donor show "HEAD:$src" > "$target"
                echo "RESTORED: $target  <=  $url:$src"
              fi
            done < missing_i.txt
            rm -rf donor donor_files.txt
            scan_missing
            if [ ! -s missing_i.txt ]; then
              echo "সব missing ফাইল donor থেকে পাওয়া গেছে।"
              exit 0
            fi
          done <<< "${DONORS}"

          echo "::warning::এখনও missing:"
          cat missing_i.txt

          # 2) কোন CONFIG ওই driver build করছে সেটা বের করা
          find_symbol() {
            local dir name parent sym
            dir="$(dirname "$1")"
            while [ "$dir" != "." ] && [ "$dir" != "/" ]; do
              parent="$(dirname "$dir")"; name="$(basename "$dir")"
              sym="$(grep -hE "(^|[[:space:]=])${name}/" "$parent/Makefile" 2>/dev/null | sed -nE 's/.*\$\(CONFIG_([A-Za-z0-9_]+)\).*/\1/p' | head -n1)"
              if [ -n "$sym" ]; then echo "$sym"; return; fi
              dir="$parent"
            done
          }
          : > disable_syms.txt
          while read -r t; do
            sym="$(find_symbol "$t")"
            [ -n "$sym" ] && echo "$sym" >> disable_syms.txt
          done < missing_i.txt
          sort -u disable_syms.txt -o disable_syms.txt
          echo "এই CONFIG symbol ওই driver build করছে:"
          cat disable_syms.txt

          # 3) skip_missing=true হলে ওই driver disable করে build চালানো
          if [ "${SKIP_MISSING}" = "true" ] && [ -s disable_syms.txt ]; then
            list=""
            for s in $(cat disable_syms.txt); do list="$list CONFIG_${s}=n"; done
            echo "::warning::skip_missing ON, disable হচ্ছে:${list} (ওই driver-এর hardware ডিভাইসে কাজ করবে না!)"
            echo "DISABLE_CONFIGS=${list}" >> "$GITHUB_ENV"
          else
            echo "Fix: (1) git add -f <file> করে push, (2) donor_repo input, অথবা (3) skip_missing=true (hardware কাজ করবে না)"
          fi

      - name: Build kernel
        run: |
          set -eo pipefail
          export PATH="/usr/lib/ccache:$PATH"
          mkdir -p out

          MAKE_ARGS=(
            O=out
            ARCH=arm64
            SUBARCH=arm64
            "CC=ccache clang"
            HOSTCC=clang
            HOSTCXX=clang++
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            READELF=llvm-readelf
            STRIP=llvm-strip
            KCFLAGS=-Wno-error
          )

          make -j"$(nproc)" "${MAKE_ARGS[@]}" "${DEFCONFIG}"

          # Optional extra configs (NetHunter tweak ইত্যাদির জন্য)
          ALL_CONFIGS="$(echo ${EXTRA_CONFIGS} ${DISABLE_CONFIGS:-})"
          if [ -n "${ALL_CONFIGS}" ]; then
            for opt in ${ALL_CONFIGS}; do
              name="${opt%%=*}"; name="${name#CONFIG_}"
              val="${opt#*=}"
              case "$val" in
                y) ./scripts/config --file out/.config --enable "$name" ;;
                n) ./scripts/config --file out/.config --disable "$name" ;;
                m) ./scripts/config --file out/.config --module "$name" ;;
                *) ./scripts/config --file out/.config --set-val "$name" "$val" ;;
              esac
            done
            make -j"$(nproc)" "${MAKE_ARGS[@]}" olddefconfig
          fi

          if ! make -j"$(nproc)" "${MAKE_ARGS[@]}" Image Image.gz dtbs 2>&1 | tee build.log; then
            echo "::error::Build failed. First errors from the log:"
            grep -nE 'error:|Error [0-9]+|undefined reference|No rule to make target|fatal' build.log | head -30 || true
            echo "---- rerun with -j1 to get the exact failing step ----"
            make -j1 "${MAKE_ARGS[@]}" Image 2>&1 | tail -n 40 || true
            exit 1
          fi

          if grep -q '^CONFIG_MODULES=y' out/.config; then
            make -j"$(nproc)" "${MAKE_ARGS[@]}" modules 2>&1 | tee -a build.log
          fi

          ls -lh out/arch/arm64/boot/
          ccache -s || true

      - name: Package AnyKernel3 zip
        id: pack
        run: |
          set -e
          KVER="$(make -s O=out ARCH=arm64 kernelversion)"
          DATE="$(date +%Y%m%d-%H%M)"
          ZIPNAME="Stone-NetHunter-${KVER}-${DATE}-${GITHUB_SHA::7}.zip"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/LICENSE ak3/ramdisk ak3/patch 2>/dev/null || true
          mkdir -p ak3/ramdisk ak3/patch

          cp out/arch/arm64/boot/Image ak3/Image

          # সব built dtb একসাথে (header v2 ডিভাইসে কাজে লাগবে)
          DTBS="$(find out/arch/arm64/boot/dts -name '*.dtb' | sort)"
          if [ -n "$DTBS" ]; then
            cat $DTBS > ak3/dtb
            mkdir -p dtbs_out && cp $DTBS dtbs_out/
          fi

          cat > ak3/anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Stone NetHunter Kernel by Aafiq (HackX)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=sunstone
          device.name2=moonstone
          device.name3=stone
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF
          sed -i 's/^          //' ak3/anykernel.sh

          cd ak3 && zip -r9 "../${ZIPNAME}" . -x '.git*' && cd ..
          echo "zipname=${ZIPNAME}" >> "$GITHUB_OUTPUT"
          echo "kver=${KVER}" >> "$GITHUB_OUTPUT"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.zipname }}
          path: ${{ steps.pack.outputs.zipname }}

      - name: Upload raw boot files (Image, Image.gz, dtbs)
        uses: actions/upload-artifact@v4
        with:
          name: stone-raw-boot-files
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            dtbs_out/
          if-no-files-found: warn

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: ${{ inputs.release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stone-nh-${{ github.run_number }}
          name: Stone NetHunter ${{ steps.pack.outputs.kver }} (#${{ github.run_number }})
          body: |
            Stone NetHunter kernel (sunstone / moonstone)
            Linux ${{ steps.pack.outputs.kver }} — toolchain: ${{ env.TOOLCHAIN }}
            Commit: ${{ github.sha }}
          files: ${{ steps.pack.outputs.zipname }}
          
